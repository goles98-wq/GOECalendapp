<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOE Calendar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#F6F7F4; --ink:#16212B; --muted:#5E6B74; --line:#D5DAD4;
  --brass:#A8741A; --brass-soft:#F3E6CC; --pine:#24463E; --pine-ink:#E6ECE7; --pine-muted:#9DB2AA;
  --danger:#B23A3A; --ok:#2F7A55;
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171A; --surface:#172126; --surface-2:#1C282E; --ink:#E7ECEA; --muted:#93A1A6; --line:#29373D;
    --brass:#D6A24A; --brass-soft:#3A2F1C; --pine:#0B1215; --pine-ink:#DCE5E0; --pine-muted:#7F948C;
  }
}
:root[data-theme="dark"]{
  --bg:#10171A; --surface:#172126; --surface-2:#1C282E; --ink:#E7ECEA; --muted:#93A1A6; --line:#29373D;
  --brass:#D6A24A; --brass-soft:#3A2F1C; --pine:#0B1215; --pine-ink:#DCE5E0; --pine-muted:#7F948C;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:248px 1fr;height:100%}
/* Sidebar */
.side{background:var(--pine);color:var(--pine-ink);display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;padding:0 8px 18px;display:flex;align-items:baseline;gap:6px}
.brand small{font-weight:500;font-size:13px;color:var(--pine-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.plist button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-s);color:var(--pine-ink);font-weight:500}
.nav button:hover,.plist button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="true"],.plist button[aria-current="true"]{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--brass)}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.side h3{font:600 13px var(--body);color:var(--pine-muted);margin:22px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.side h3 button{all:unset;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;color:var(--pine-ink)}
.plist{display:flex;flex-direction:column;gap:1px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.plist .count{margin-left:auto;font-size:12px;color:var(--pine-muted)}
.prow{display:flex;align-items:center;gap:2px;padding-left:calc(var(--d,0) * 14px)}
.prow .pmain{flex:1;min-width:0}
.plist .chev,.plist .mini{padding:4px 5px;flex:none;color:var(--pine-muted);font-size:12px;line-height:1;justify-content:center;min-width:12px}
.plist .chev:hover,.plist .mini:hover{color:var(--pine-ink)}
.chev-sp{width:22px;flex:none}
.proj-row.sub{padding-left:calc(var(--d) * 16px)}
.proj-row.sub .lbl{font-size:13.5px}
.side-foot{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:2px}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--bg)}
.top h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;white-space:nowrap}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:6px 10px;min-width:0;width:240px}
.search input{border:0;background:none;outline:none;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);padding:7px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.brass{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);width:36px;height:36px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.menu-btn{display:none}
.view{flex:1;overflow:auto;padding:24px 28px 48px}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filters select,.field select,.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:7px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Today */
.today-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.bigdate{font-family:var(--display);font-weight:800;font-size:clamp(56px,9vw,104px);line-height:.85;letter-spacing:-.04em}
.bigdate-sub{font-family:var(--display);font-size:22px;font-weight:500;color:var(--muted);line-height:1.2}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px 20px}
.panel h2{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.panel h2 span{font:500 13px var(--body);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:13px;color:var(--muted);white-space:nowrap}
.time{font-variant-numeric:tabular-nums;font-weight:700;width:48px;flex:none}
.late{color:var(--danger);font-weight:600}
.check{appearance:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex:none;display:grid;place-items:center;cursor:pointer;margin:0;background:var(--surface)}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.proj-row{padding:8px 0}
.proj-row .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-title{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 8px 0 0;text-transform:capitalize}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius-l);overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--surface-2);padding:8px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.cell{background:var(--surface);min-height:118px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-2)}
.cell.out .num{color:var(--muted);opacity:.6}
.num{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;padding:2px 4px 4px;letter-spacing:-.02em}
.cell.is-today .num{color:var(--brass)}
.cell.is-today{box-shadow:inset 0 3px 0 var(--brass)}
.chip{display:flex;align-items:center;gap:5px;font-size:12.5px;line-height:1.3;padding:2px 6px;border-radius:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;cursor:pointer}
.chip.ev{background:var(--c-soft);color:var(--ink);border-left:3px solid var(--c);min-height:18px}
.chip.tk{color:var(--muted)}
.chip.tk::before{content:"";width:9px;height:9px;border:1.5px solid var(--c);border-radius:3px;flex:none}
.chip.tk.is-done{text-decoration:line-through}
.chip b{font-weight:700;font-variant-numeric:tabular-nums}
.chip span{overflow:hidden;text-overflow:ellipsis}
.more{font-size:12px;color:var(--muted);padding-left:6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);min-height:340px;padding:10px;display:flex;flex-direction:column;gap:5px}
.wday h4{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.wday h4 small{font-size:26px;letter-spacing:-.03em}
.wday.is-today h4{color:var(--brass)}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:16px;overflow-x:auto;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-l);padding:12px;min-height:200px}
.col.over{outline:2px dashed var(--brass);outline-offset:-4px}
.col h3{margin:0 0 10px;font-family:var(--display);font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.col h3 span{font:600 13px var(--body);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 12px;margin-bottom:8px;cursor:grab;border-left:4px solid var(--c)}
.card:active{cursor:grabbing}
.card .ct{font-weight:600;margin-bottom:6px}
.card .cm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.prio{font-size:12px;font-weight:700;padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
.prio.alta{color:var(--danger);border-color:currentColor}
.prio.urgente{background:var(--danger);color:#fff;border-color:var(--danger)}
.avs{display:inline-flex;margin-left:auto}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-left:-6px}
.add-inline{width:100%;border:1px dashed var(--line);background:none;border-radius:var(--radius-m);padding:8px;color:var(--muted);font-weight:600}

/* List */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.tag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

/* Meetings */
.day-group{margin-bottom:22px}
.day-group h3{font-family:var(--display);font-size:17px;margin:0 0 8px;font-weight:700;text-transform:capitalize}
.meet{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--radius-m);padding:12px 16px;margin-bottom:8px;cursor:pointer}
.meet .mt{font-weight:700;font-variant-numeric:tabular-nums}
.meet .mn{font-weight:600}
.meet .ms{font-size:13px;color:var(--muted)}
.kind{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--brass-soft);color:var(--ink)}

/* People */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.person .av{width:42px;height:42px;font-size:15px;margin:0;border:0}
.person .pn{font-weight:700}
.person .pr{font-size:13px;color:var(--muted)}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(10,16,20,.45);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border-radius:var(--radius-l);width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal header h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700}
.modal .body{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.modal footer .left{margin-right:auto}
.title-input{font-family:var(--display);font-size:22px;font-weight:700;border:0;border-bottom:2px solid var(--line);background:none;padding:4px 0;width:100%;outline:none}
.title-input:focus{border-color:var(--brass)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.field textarea{min-height:80px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.pick button .av{width:22px;height:22px;margin:0;border:0;font-size:10px}
.pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.pick button[aria-pressed="false"]{opacity:.7}
.cl{display:flex;flex-direction:column;gap:2px}
.cl-item{display:flex;align-items:center;gap:10px;padding:5px 0}
.cl-item input[type=text]{flex:1;border:0;background:none;outline:none;padding:2px 0;border-bottom:1px solid transparent}
.cl-item input[type=text]:focus{border-bottom-color:var(--line)}
.cl-item.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.cl-item .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.cl-add{display:flex;gap:8px}
.cl-add input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:7px 10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:8px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}

/* AI drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease;box-shadow:-20px 0 60px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-family:var(--display);font-size:20px}
.drawer .dbody{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.drawer .dfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.drawer textarea{width:100%;min-height:90px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 12px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:none;border-radius:20px;padding:4px 10px;font-size:13px}
.msg{padding:10px 12px;border-radius:var(--radius-m);font-size:14px;white-space:pre-wrap}
.msg.me{background:var(--surface-2);align-self:flex-end;max-width:90%}
.msg.ai{background:var(--brass-soft)}
.msg.err{background:none;border:1px solid var(--danger);color:var(--danger)}
.prop{border:1px solid var(--line);border-radius:var(--radius-m);padding:8px 10px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.prop .ps{font-size:12.5px;color:var(--muted)}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--radius-m);font-weight:600;z-index:60;font-size:14px}

/* Recurrencia */
.rep-box{border:1px solid var(--line);border-radius:var(--radius-m);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.dows{display:flex;gap:4px;flex-wrap:wrap}
.dows button{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.dows button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rep-end{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.rep-end input[type=date],.rep-end input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:5px 8px}
.rep-end input[type=number]{width:70px}
.rep-ico{font-size:11px;opacity:.75;margin-left:2px}
/* Colaboradores y cartera */
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.badge.agencia{background:#E3ECE8;border-color:#BCD2C8;color:#1F4A3E}
.badge.freelance{background:#E6EAF3;border-color:#C3CDE2;color:#2C4577}
.badge.profesional{background:#F3E6CC;border-color:#E2CD9F;color:#6B4A10}
:root[data-theme="dark"] .badge.agencia,:root[data-theme="dark"] .badge.freelance,:root[data-theme="dark"] .badge.profesional{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.agencia,:root:not([data-theme="light"]) .badge.freelance,:root:not([data-theme="light"]) .badge.profesional{background:var(--surface-2);border-color:var(--line);color:var(--ink)}}
.badge.ok{color:var(--ok);border-color:currentColor;background:none}
.badge.warn{color:var(--brass);border-color:currentColor;background:none}
.badge.off{color:var(--muted);background:none}
.person{align-items:flex-start;flex-direction:column;gap:10px}
.person .ph{display:flex;gap:12px;align-items:center;width:100%}
.person .pstats{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;width:100%}
.person .pstats b{color:var(--ink);font-weight:700}
.p-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.p-head .av{width:64px;height:64px;font-size:22px;border:0;margin:0}
.p-head h2{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1}
.p-head .sub{color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.p-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:0;margin-bottom:14px}
.span2{grid-column:1/-1}
.tl{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.tl:first-of-type{border-top:0}
.tl .tld{width:78px;flex:none;color:var(--muted);font-size:13px}
.tl .tlx{flex:1;min-width:0}
.tl .x{border:0;background:none;color:var(--muted);font-size:16px}
.num-r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.filters input.fi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:7px 10px;width:130px}
.store{font-size:12.5px;color:var(--pine-muted);padding:8px 10px 4px;line-height:1.4}
.store button{all:unset;cursor:pointer;color:var(--pine-ink);text-decoration:underline;text-underline-offset:2px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap}
@media (max-width:900px){.p-actions{margin-left:0}.p-head h2{font-size:26px}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:45;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.3)}
  .menu-btn{display:grid}
  .top{padding:12px 16px;flex-wrap:wrap}
  .top h1{font-size:21px}
  .search{order:5;width:100%}
  .view{padding:16px 16px 40px}
  .hide-m{display:none}
  .cell{min-height:74px;padding:4px 3px}
  .chip span{display:none}
  .chip{padding:2px 4px}
  .num{font-size:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .meet{grid-template-columns:1fr}
}

<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">GOE <small>Calendar</small></div>
    <nav class="nav" id="nav"></nav>
    <h3>Proyectos <button data-act="newProject" aria-label="Nuevo proyecto">+</button></h3>
    <div class="plist" id="plist"></div>
    <div class="side-foot">
      <div class="store" id="store"></div>
      <nav class="nav">
        <button data-act="openAI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></svg>Asistente IA</button>
        <button data-act="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Ajustes y datos</button>
      </nav>

  <div class="main">
    <header class="top">

      <h1 id="title">Hoy</h1>
      <div class="grow"></div>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="Buscar tareas y citas" aria-label="Buscar"></label>
      <button class="btn" data-act="newEvent">+ Cita</button>
      <button class="btn primary" data-act="newTask">+ Tarea</button>
      <button class="icon-btn hide-m" data-act="theme" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<aside class="drawer" id="drawer" aria-label="Asistente IA">
  <header><h2>Asistente IA</h2><button class="icon-btn" data-act="closeAI" aria-label="Cerrar">✕</button></header>
  <div class="dbody" id="aiLog">
    <div class="note">Describe lo que necesitas y el asistente propondrá tareas y citas para que las revises antes de añadirlas. Ejemplo: «Reunión con Xavi el jueves a las 10 sobre la web y tareas para preparar la propuesta».</div>
  </div>

    <div class="quick">
      <button data-act="aiQuick" data-q="Resume mi semana: qué citas tengo, qué tareas vencen y qué está atrasado. Sugiere prioridades.">Resumir mi semana</button>
      <button data-act="aiQuick" data-q="Revisa mis tareas atrasadas y propón nuevas fechas realistas.">Replanificar atrasadas</button>
      <button data-act="aiQuick" data-q="¿Qué inmuebles disponibles hay en la cartera de mis colaboradores? Agrúpalos por zona y rango de precio.">Resumen de carteras</button>

<div id="modalRoot"></div>

<script>
/* ============ Datos y utilidades ============ */
const KEY = 'goecalendar.v1';
const COLORS = ['#2F6F5E','#A8741A','#3B5B92','#8E4A5A','#5A6B2F','#6B4C9A','#2A7F8F','#B0553A'];
const STATUS = [['todo','Por hacer'],['doing','En curso'],['review','En revisión'],['done','Hecho']];
const PRIOS = [['baja','Baja'],['media','Media'],['alta','Alta'],['urgente','Urgente']];
const KINDS = [['reunion','Reunión'],['cita','Cita'],['llamada','Llamada'],['evento','Evento']];
const PTYPES = [['agencia','Agencia inmobiliaria'],['freelance','Freelance'],['profesional','Profesional (abogado, notario, gestor…)'],['equipo','Equipo interno'],['otro','Otro']];
const PTYPE_SHORT = {agencia:'Agencia',freelance:'Freelance',profesional:'Profesional',equipo:'Equipo',otro:'Otro'};
const IKINDS = [['inmueble','Inmueble'],['servicio','Servicio'],['otro','Otro']];
const OPS = [['venta','Venta'],['alquiler','Alquiler'],['traspaso','Traspaso']];
const PROPS = [['piso','Piso'],['casa','Casa'],['atico','Ático'],['local','Local'],['oficina','Oficina'],['nave','Nave'],['terreno','Terreno'],['edificio','Edificio'],['parking','Parking']];
const ISTATUS = [['disponible','Disponible'],['reservado','Reservado'],['cerrado','Vendido / cerrado']];
const CHANNELS = [['llamada','Llamada'],['whatsapp','WhatsApp'],['email','Email'],['reunion','Reunión'],['visita','Visita']];
const STALE_DAYS = 30;
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDay = s => parseYmd(s).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
const fmtLong = s => parseYmd(s).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const initials = n => (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const soft = hex => hex + '26';
const eur = n => (n===''||n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const daysSince = s => s ? Math.floor((parseYmd(today()) - parseYmd(s))/864e5) : null;
const label = (arr,k) => (arr.find(x=>x[0]===k)||[k,k])[1];
const $ = s => document.querySelector(s);

function seed(){
  const t = today();
  const p1 = {id:uid(), name:'Clientes', color:COLORS[0], desc:''};
  const p2 = {id:uid(), name:'Web y marca', color:COLORS[1], desc:''};
  const a = {id:uid(), name:'Ana Colaboradora', type:'freelance', company:'', role:'Diseño y web', email:'', phone:'', zone:'Barcelona', commission:'', notes:'Ejemplo', color:COLORS[2], portfolioUpdated:t, log:[],
    portfolio:[{id:uid(), kind:'servicio', title:'Diseño de web corporativa', status:'disponible', price:1800, unit:'proyecto', zone:'Remoto', link:'', notes:'', updated:t}]};
  const ag = {id:uid(), name:'Inmobiliaria Ejemplo', type:'agencia', company:'Inmobiliaria Ejemplo S.L.', role:'Residencial', email:'', phone:'', zone:'Sant Cugat, Barcelona', commission:'50% de honorarios compartidos', notes:'', color:COLORS[0], portfolioUpdated:addDays(t,-40), log:[{id:uid(), date:addDays(t,-40), channel:'llamada', text:'Nos pasan listado de producto nuevo'}],
    portfolio:[
      {id:uid(), kind:'inmueble', title:'Piso con terraza cerca de estación', status:'disponible', operation:'venta', propType:'piso', zone:'Sant Cugat', price:465000, m2:95, rooms:3, ref:'EJ-101', link:'', notes:'', updated:addDays(t,-40)},
      {id:uid(), kind:'inmueble', title:'Local a pie de calle', status:'reservado', operation:'alquiler', propType:'local', zone:'Barcelona, Eixample', price:2100, m2:120, rooms:'', ref:'EJ-102', link:'', notes:'', updated:addDays(t,-40)}
    ]};
  return {
    projects:[p1,p2], people:[a,ag],
    tasks:[
      {id:uid(), title:'Preparar propuesta para cliente', desc:'', projectId:p1.id, status:'doing', priority:'alta', due:addDays(t,2), assignees:[a.id], checklist:[{id:uid(),text:'Recopilar datos',done:true},{id:uid(),text:'Redactar borrador',done:false}], createdAt:Date.now()},
      {id:uid(), title:'Revisar textos de la web', desc:'', projectId:p2.id, status:'todo', priority:'media', due:addDays(t,5), assignees:[], checklist:[], createdAt:Date.now()}
    ],
    events:[
      {id:uid(), title:'Reunión de seguimiento', kind:'reunion', date:t, start:'10:00', end:'11:00', projectId:p1.id, attendees:[a.id], location:'', notes:'', checklist:[{id:uid(),text:'Estado de las propuestas',done:false}]}
    ],
    settings:{apiKey:'', model:'claude-sonnet-5', theme:''},
    ui:{view:'today', project:'', calMode:'month', calCursor:t, fAssignee:'', fPrio:'', fStatus:'', showDone:false, kindFilter:'', pType:'', personId:'', pfKind:'', pfOp:'', pfProp:'', pfZone:'', pfMin:'', pfMax:'', pfStatus:'disponible', pfOwnerType:'', collapsed:{}}
  };
}
function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
let S = load() || seed();
function normalize(){
  S.ui = Object.assign(seed().ui, S.ui || {}); S.settings = Object.assign({apiKey:'',model:'claude-sonnet-5',theme:''}, S.settings||{});
  ['projects','people','tasks','events'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
  S.projects.forEach(p=>{ if(!p.parentId || !S.projects.some(q=>q.id===p.parentId) || p.parentId===p.id) p.parentId=''; });
  S.people.forEach(p=>{ Object.entries({type:'otro',company:'',role:'',email:'',phone:'',zone:'',commission:'',notes:'',portfolioUpdated:'',color:COLORS[2]}).forEach(([k,v])=>{ if(p[k]==null) p[k]=v; }); if(!Array.isArray(p.portfolio)) p.portfolio=[]; if(!Array.isArray(p.log)) p.log=[]; });
}
normalize();
let memOnly = false;
function save(){ S.savedAt = Date.now(); scheduleFileWrite(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ if(!memOnly){ memOnly=true; toast('El navegador no permite guardar: los cambios se perderán al cerrar. Exporta tus datos en Ajustes.'); } } }
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2800); }

const proj = id => S.projects.find(p=>p.id===id);
const person = id => S.people.find(p=>p.id===id);
const pColor = id => proj(id)?.color || '#7A858C';
/* ---- Subproyectos ---- */
const kids = id => S.projects.filter(p=>(p.parentId||'')===id);
function descIds(id){ const out = new Set([id]); let added = true; while(added){ added = false; S.projects.forEach(p=>{ if(p.parentId && out.has(p.parentId) && !out.has(p.id)){ out.add(p.id); added = true; } }); } return out; }
const projPath = id => { const parts = []; let p = proj(id), g = 0; while(p && g++ < 12){ parts.unshift(p.name); p = proj(p.parentId); } return parts.join(' › '); };
function projTree(rootId=''){ const out = []; const walk = (pid, depth) => kids(pid).forEach(p=>{ out.push({p, depth}); walk(p.id, depth+1); });
  if(rootId){ const r = proj(rootId); if(r){ out.push({p:r, depth:0}); walk(rootId, 1); } return out; }
  walk('', 0); S.projects.forEach(p=>{ if(!out.some(o=>o.p.id===p.id)) out.push({p, depth:0}); }); return out; }
function findProj(name){ const n = (name||'').toLowerCase().replace(/\s*[›>\/]\s*/g,' › ').trim(); if(!n) return null;
  return S.projects.find(p=>projPath(p.id).toLowerCase()===n) || S.projects.find(p=>p.name.toLowerCase()===n.split(' › ').pop()) || findBy(S.projects, n.split(' › ').pop()); }
let _pset = {k:null, s:null};
const inProj = x => { if(!S.ui.project) return true; const k = S.ui.project + '|' + S.projects.map(p=>p.id+(p.parentId||'')).join(); if(_pset.k!==k) _pset = {k, s:descIds(S.ui.project)}; return _pset.s.has(x.projectId); };
const q = () => ($('#q').value||'').trim().toLowerCase();
const matchQ = x => !q() || (x.title+' '+(x.desc||x.notes||'')).toLowerCase().includes(q());
const visTasks = () => S.tasks.filter(t=>inProj(t)&&matchQ(t));
const visEvents = () => S.events.filter(e=>inProj(e)&&matchQ(e));
/* ---- Citas recurrentes ---- */
const FREQS = [['none','No se repite'],['daily','Cada día'],['weekdays','De lunes a viernes'],['weekly','Cada semana'],['monthly','Cada mes'],['yearly','Cada año']];
const DOW_S = ['L','M','X','J','V','S','D'];
const DOW_L = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const dowOf = s => (parseYmd(s).getDay()+6)%7;
const isRec = e => e.repeat && e.repeat.freq && e.repeat.freq!=='none';
function matchesRule(e, ds){
  const r = e.repeat, n = Math.max(1, +r.interval||1), a = parseYmd(e.date), d = parseYmd(ds);
  const diff = Math.round((d - a)/864e5);
  switch(r.freq){
    case 'daily': return diff % n === 0;
    case 'weekdays': return dowOf(ds) < 5;
    case 'weekly': { const days = r.days?.length ? r.days : [dowOf(e.date)]; if(!days.includes(dowOf(ds))) return false;
      const wk = Math.floor((diff + dowOf(e.date))/7); return wk % n === 0; }
    case 'monthly': { const m = (d.getFullYear()-a.getFullYear())*12 + d.getMonth()-a.getMonth(); return d.getDate()===a.getDate() && m % n === 0; }
    case 'yearly': return d.getDate()===a.getDate() && d.getMonth()===a.getMonth() && (d.getFullYear()-a.getFullYear()) % n === 0;
  }
  return false;
}
// Fechas en las que ocurre una cita entre from y to (incluidos)
function occurrences(e, from, to){
  if(!isRec(e)) return (e.date>=from && e.date<=to) ? [e.date] : [];
  const r = e.repeat, out = [], ex = new Set(e.exdates||[]);
  const hardEnd = r.until && r.until < to ? r.until : to;
  const maxCount = +r.count > 0 ? +r.count : Infinity;
  let ds = e.date, count = 0, guard = 0;
  while(ds <= hardEnd && count < maxCount && guard++ < 4000){
    if(matchesRule(e, ds)){ count++; if(ds >= from && !ex.has(ds)) out.push(ds); }
    ds = addDays(ds, 1);
  }
  return out;
}
// Todas las ocurrencias visibles entre dos fechas, ordenadas
function eventsBetween(from, to, list){
  const t = today(), lo = addDays(t,-365), hi = addDays(t,400);
  return (list || visEvents()).flatMap(e=>{
    const f = isRec(e) && from < lo ? lo : from, tt = isRec(e) && to > hi ? hi : to;
    return occurrences(e, f, tt).map(d=>({...e, date:d, occ:d, series:e.date}));
  }).sort(byTime);
}
function repeatText(e){
  if(!isRec(e)) return '';
  const r = e.repeat, n = +r.interval||1;
  let s = {daily: n>1?`Cada ${n} días`:'Cada día', weekdays:'De lunes a viernes', monthly: `${n>1?`Cada ${n} meses`:'Cada mes'}, el día ${parseYmd(e.date).getDate()}`, yearly: n>1?`Cada ${n} años`:'Cada año'}[r.freq];
  if(r.freq==='weekly'){ const days = (r.days?.length?r.days:[dowOf(e.date)]).slice().sort().map(i=>DOW_L[i]); s = `${n>1?`Cada ${n} semanas`:'Cada semana'}: ${days.join(', ')}`; }
  if(r.until) s += `, hasta el ${fmtDay(r.until)}`; else if(+r.count>0) s += `, ${r.count} veces`;
  return s;
}
const avatars = ids => `<span class="avs">${(ids||[]).map(person).filter(Boolean).map(p=>`<span class="av" style="background:${p.color}" title="${esc(p.name)}">${esc(initials(p.name))}</span>`).join('')}</span>`;
const clProgress = cl => cl?.length ? `${cl.filter(c=>c.done).length}/${cl.length}` : '';
const isLate = t => t.due && t.status!=='done' && t.due < today();

/* ============ Navegación ============ */
const ICONS = {
  today:'<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  board:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>',
  list:'<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
  meetings:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 5.5"/>',
  people:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
  portfolio:'<path d="M3 10l9-6 9 6v10a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M9 21v-6h6v6"/>'
};
const VIEWS = [['today','Hoy'],['calendar','Calendario'],['board','Tablero'],['list','Tareas'],['meetings','Reuniones y citas'],['people','Colaboradores'],['portfolio','Cartera de colaboradores']];

function renderNav(){
  $('#nav').innerHTML = VIEWS.map(([k,n])=>`<button data-act="view" data-v="${k}" aria-current="${S.ui.view===k || (k==='people'&&S.ui.view==='person')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${n}</button>`).join('');
  const open = t => t.status!=='done';
  $('#plist').innerHTML = `<button data-act="proj" data-id="" aria-current="${!S.ui.project}"><span class="dot" style="background:var(--pine-muted)"></span>Todos<span class="count">${S.tasks.filter(open).length}</span></button>` +
    (()=>{ const col = S.ui.collapsed||{}; const hidden = new Set(); projTree().forEach(({p})=>{ if(hidden.has(p.parentId) || (p.parentId && col[p.parentId])) hidden.add(p.id); });
      return projTree().filter(o=>!hidden.has(o.p.id)).map(({p,depth})=>{ const has = kids(p.id).length, sel = S.ui.project===p.id, ids = descIds(p.id);
        return `<div class="prow" style="--d:${depth}">${has?`<button class="chev" data-act="toggleProj" data-id="${p.id}" aria-label="${col[p.id]?'Desplegar':'Plegar'} subproyectos">${col[p.id]?'▸':'▾'}</button>`:'<span class="chev-sp"></span>'}
          <button class="pmain" data-act="proj" data-id="${p.id}" aria-current="${sel}"><span class="dot" style="background:${p.color}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><span class="count">${S.tasks.filter(t=>ids.has(t.projectId)&&open(t)).length}</span></button>
          ${sel?`<button class="mini" data-act="newSubProject" data-id="${p.id}" title="Nuevo subproyecto" aria-label="Nuevo subproyecto">＋</button><button class="mini" data-act="editProject" data-id="${p.id}" title="Editar proyecto" aria-label="Editar proyecto">✎</button>`:''}</div>`; }).join(''); })();
}
function render(){
  renderNav(); renderStorage();
  if(S.ui.view==='person' && !person(S.ui.personId)) S.ui.view='people';
  const v = S.ui.view, p = proj(S.ui.project);
  $('#title').textContent = v==='person' ? 'Colaborador' : (VIEWS.find(x=>x[0]===v)||[,''])[1] + (p && !['people','portfolio'].includes(v) ? ` · ${projPath(p.id)}` : '');
  const fn = {today:vToday, calendar:vCalendar, board:vBoard, list:vList, meetings:vMeetings, people:vPeople, person:vPerson, portfolio:vPortfolio}[v] || vToday;
  $('#view').innerHTML = fn();
  if(v==='board') bindBoard();
}

/* ============ Vistas ============ */
function taskRow(t, showDate=true){
  const late = isLate(t);
  return `<div class="row ${t.status==='done'?'done':''}" data-act="openTask" data-id="${t.id}">
    <input type="checkbox" class="check" data-act="toggleTask" data-id="${t.id}" ${t.status==='done'?'checked':''} aria-label="Completar">
    <span class="dot" style="background:${pColor(t.projectId)}"></span>
    <span class="t">${esc(t.title)}</span>
    ${clProgress(t.checklist)?`<span class="meta">☑ ${clProgress(t.checklist)}</span>`:''}
    ${showDate&&t.due?`<span class="meta ${late?'late':''}">${fmtDay(t.due)}</span>`:''}
  </div>`;
}
function eventRow(e, withDate=false){
  return `<div class="row" data-act="openEvent" data-id="${e.id}" data-occ="${e.occ||''}">
    <span class="time">${esc(e.start||'—')}</span>
    <span class="dot" style="background:${pColor(e.projectId)}"></span>
    <span class="t">${esc(e.title)}${isRec(e)?'<span class="rep-ico" title="Se repite"> ↻</span>':''}</span>
    <span class="meta">${withDate?fmtDay(e.date)+' · ':''}${label(KINDS,e.kind)}</span>
  </div>`;
}
const byTime = (a,b) => (a.date+a.start).localeCompare(b.date+b.start);

function vToday(){
  const t = today(), d = new Date();
  const evs = eventsBetween(t,t);
  const tasks = visTasks().filter(x=>x.status!=='done');
  const late = tasks.filter(isLate).sort((a,b)=>a.due.localeCompare(b.due));
  const dueToday = tasks.filter(x=>x.due===t);
  const wk = addDays(t,7);
  const upcomingT = tasks.filter(x=>x.due>t && x.due<=wk).sort((a,b)=>a.due.localeCompare(b.due));
  const upcomingE = eventsBetween(addDays(t,1), wk);
  const projs = projTree(S.ui.project).map(({p,depth})=>{
    const ids = descIds(p.id), all = S.tasks.filter(x=>ids.has(x.projectId)), done = all.filter(x=>x.status==='done').length;
    return {p, depth, all:all.length, done, pct: all.length?Math.round(done/all.length*100):0};
  });
  return `
  <div class="today-head">
    <div class="bigdate">${d.getDate()}</div>
    <div class="bigdate-sub">${d.toLocaleDateString('es-ES',{weekday:'long'})}<br>${d.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</div>
  </div>
  <div class="cols">
    <section class="panel"><h2>Agenda de hoy <span>${evs.length} ${evs.length===1?'cita':'citas'}</span></h2>
      ${evs.length?evs.map(e=>eventRow(e)).join(''):`<div class="empty">Sin citas hoy. <button class="btn sm ghost" data-act="newEvent" data-date="${t}">Añadir cita</button></div>`}
    </section>
    <section class="panel"><h2>Para hoy <span>${dueToday.length+late.length} pendientes</span></h2>
      ${late.map(x=>taskRow(x)).join('')}${dueToday.map(x=>taskRow(x,false)).join('')}
      ${!(late.length+dueToday.length)?'<div class="empty">Nada vence hoy.</div>':''}
    </section>
    <section class="panel"><h2>Próximos 7 días</h2>
      ${upcomingE.map(e=>eventRow(e,true)).join('')}${upcomingT.map(x=>taskRow(x)).join('')}
      ${!(upcomingE.length+upcomingT.length)?'<div class="empty">Semana despejada.</div>':''}
    </section>
    ${(()=>{ const st = S.people.filter(isStale); return st.length ? `<section class="panel"><h2>Carteras por actualizar <span>más de ${STALE_DAYS} días</span></h2>${st.map(p=>`<div class="row" data-act="openPerson" data-id="${p.id}"><span class="av" style="background:${p.color};margin:0;border:0">${esc(initials(p.name))}</span><span class="t">${esc(p.name)}</span><span class="meta late">${p.portfolioUpdated?`hace ${daysSince(p.portfolioUpdated)} días`:'sin cartera'}</span></div>`).join('')}</section>` : ''; })()}
    <section class="panel"><h2>Progreso por proyecto</h2>
      ${projs.length?projs.map(o=>`<div class="proj-row ${o.depth?'sub':''}" data-act="proj" data-id="${o.p.id}" style="cursor:pointer;--d:${o.depth}"><div class="lbl"><span class="tag"><span class="dot" style="background:${o.p.color}"></span>${esc(o.p.name)}</span><span class="meta">${o.done}/${o.all}</span></div><div class="bar"><i style="width:${o.pct}%;background:${o.p.color}"></i></div></div>`).join(''):'<div class="empty">Crea tu primer proyecto desde el menú lateral.</div>'}
    </section>
  </div>`;
}

function dayItems(ds){
  const evs = eventsBetween(ds, ds);
  const tks = visTasks().filter(t=>t.due===ds);
  return {evs,tks};
}
const evChip = e => `<div class="chip ev" style="--c:${pColor(e.projectId)};--c-soft:${soft(pColor(e.projectId))}" data-act="openEvent" data-id="${e.id}" data-occ="${e.occ||''}" title="${esc(e.start+' '+e.title+(isRec(e)?' · '+repeatText(e):''))}"><b>${esc(e.start)}</b><span>${esc(e.title)}${isRec(e)?' ↻':''}</span></div>`;
const tkChip = t => `<div class="chip tk ${t.status==='done'?'is-done':''}" style="--c:${pColor(t.projectId)}" data-act="openTask" data-id="${t.id}" title="${esc(t.title)}"><span>${esc(t.title)}</span></div>`;

function vCalendar(){
  const cur = parseYmd(S.ui.calCursor), t = today(), mode = S.ui.calMode;
  let title, body;
  if(mode==='month'){
    title = cur.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
    const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
    let cells = '';
    for(let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate()+i); const ds = ymd(d);
      const {evs,tks} = dayItems(ds); const items = [...evs.map(evChip), ...tks.map(tkChip)];
      cells += `<div class="cell ${d.getMonth()!==cur.getMonth()?'out':''} ${ds===t?'is-today':''}" data-act="newEvent" data-date="${ds}">
        <div class="num">${d.getDate()}</div>${items.slice(0,4).join('')}${items.length>4?`<div class="more">+${items.length-4} más</div>`:''}</div>`;
    }
    body = `<div class="month">${['lun','mar','mié','jue','vie','sáb','dom'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>`;
  } else {
    const mon = ymd(new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-((cur.getDay()+6)%7)));
    title = `Semana del ${fmtDay(mon)}`;
    body = `<div class="week">${Array.from({length:7},(_,i)=>{ const ds = addDays(mon,i), d=parseYmd(ds); const {evs,tks}=dayItems(ds);
      return `<div class="wday ${ds===t?'is-today':''}"><h4 data-act="newEvent" data-date="${ds}"><span>${d.toLocaleDateString('es-ES',{weekday:'short'})}</span><small>${d.getDate()}</small></h4>${evs.map(evChip).join('')}${tks.map(tkChip).join('')}<button class="add-inline" data-act="newEvent" data-date="${ds}" style="margin-top:auto">+ Añadir</button></div>`;}).join('')}</div>`;
  }
  return `<div class="cal-head">
    <h2 class="cal-title">${title}</h2>
    <button class="icon-btn" data-act="calMove" data-d="-1" aria-label="Anterior">‹</button>
    <button class="btn sm" data-act="calToday">Hoy</button>
    <button class="icon-btn" data-act="calMove" data-d="1" aria-label="Siguiente">›</button>
    <div class="grow" style="flex:1"></div>
    <div class="seg"><button data-act="calMode" data-m="month" aria-pressed="${mode==='month'}">Mes</button><button data-act="calMode" data-m="week" aria-pressed="${mode==='week'}">Semana</button></div>
  </div>${body}`;
}

function vBoard(){
  const tasks = visTasks();
  return `<div class="board">${STATUS.map(([k,n])=>{ const list = tasks.filter(t=>t.status===k).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
    return `<div class="col" data-status="${k}"><h3>${n} <span>${list.length}</span></h3>
      ${list.map(t=>`<div class="card" draggable="true" data-id="${t.id}" data-act="openTask" style="--c:${pColor(t.projectId)}">
        <div class="ct">${esc(t.title)}</div>
        <div class="cm">${t.priority!=='media'?`<span class="prio ${t.priority}">${label(PRIOS,t.priority)}</span>`:''}
          ${t.due?`<span class="${isLate(t)?'late':''}">${fmtDay(t.due)}</span>`:''}
          ${clProgress(t.checklist)?`<span>☑ ${clProgress(t.checklist)}</span>`:''}
          ${avatars(t.assignees)}</div></div>`).join('')}
      <button class="add-inline" data-act="newTask" data-status="${k}">+ Añadir tarea</button></div>`;}).join('')}</div>`;
}
function bindBoard(){
  document.querySelectorAll('.card').forEach(c=>c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);}));
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const t=S.tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){t.status=col.dataset.status;save();render();}});
  });
}

function vList(){
  const u = S.ui;
  let list = visTasks().filter(t=>(u.showDone||t.status!=='done')&&(!u.fAssignee||t.assignees.includes(u.fAssignee))&&(!u.fPrio||t.priority===u.fPrio)&&(!u.fStatus||t.status===u.fStatus));
  list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  const sel = (id,opts,val,all) => `<select data-filter="${id}"><option value="">${all}</option>${opts.map(([k,n])=>`<option value="${k}" ${val===k?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
  return `<div class="filters">
    ${sel('fAssignee',S.people.map(p=>[p.id,p.name]),u.fAssignee,'Todos los responsables')}
    ${sel('fStatus',STATUS,u.fStatus,'Todos los estados')}
    ${sel('fPrio',PRIOS,u.fPrio,'Todas las prioridades')}
    <label class="tag"><input type="checkbox" class="check" data-filter="showDone" ${u.showDone?'checked':''}> Mostrar hechas</label>
  </div>
  <div class="table-wrap"><table><thead><tr><th></th><th>Tarea</th><th>Proyecto</th><th>Estado</th><th>Prioridad</th><th>Vence</th><th>Checklist</th><th>Responsables</th></tr></thead><tbody>
  ${list.map(t=>`<tr data-act="openTask" data-id="${t.id}" class="${t.status==='done'?'done':''}">
    <td><input type="checkbox" class="check" data-act="toggleTask" data-id="${t.id}" ${t.status==='done'?'checked':''} aria-label="Completar"></td>
    <td class="t" style="font-weight:600">${esc(t.title)}</td>
    <td><span class="tag"><span class="dot" style="background:${pColor(t.projectId)}"></span>${esc(projPath(t.projectId)||'Sin proyecto')}</span></td>
    <td>${label(STATUS,t.status)}</td>
    <td><span class="prio ${t.priority}">${label(PRIOS,t.priority)}</span></td>
    <td class="${isLate(t)?'late':''}">${t.due?fmtDay(t.due):'—'}</td>
    <td>${clProgress(t.checklist)||'—'}</td>
    <td>${avatars(t.assignees)}</td></tr>`).join('') || `<tr><td colspan="8" class="empty" style="padding:24px">No hay tareas con estos filtros. <button class="btn sm" data-act="newTask">Crear tarea</button></td></tr>`}
  </tbody></table></div>`;
}

function vMeetings(){
  const t = today(), kf = S.ui.kindFilter;
  const list = visEvents().filter(e=>!kf||e.kind===kf);
  const up = eventsBetween(t, addDays(t,365), list).filter(e=>!isRec(e) || e.date<=addDays(t,60));
  const past = eventsBetween(addDays(t,-365), addDays(t,-1), list).reverse().slice(0,30);
  const group = list => { const g = {}; list.forEach(e=>(g[e.date]=g[e.date]||[]).push(e)); return Object.entries(g).map(([d,items])=>`<div class="day-group"><h3>${fmtLong(d)}${d===t?' · hoy':''}</h3>${items.map(e=>`
    <div class="meet" style="--c:${pColor(e.projectId)}" data-act="openEvent" data-id="${e.id}" data-occ="${e.occ||''}">
      <div class="mt">${esc(e.start)}${e.end?'–'+esc(e.end):''}</div>
      <div><div class="mn">${esc(e.title)}</div><div class="ms">${isRec(e)?'↻ '+esc(repeatText(e))+' · ':''}${esc(projPath(e.projectId)||'Sin proyecto')}${e.location?' · '+esc(e.location):''}${e.checklist?.length?' · ☑ '+clProgress(e.checklist):''}</div></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="kind">${label(KINDS,e.kind)}</span>${avatars(e.attendees)}</div>
    </div>`).join('')}</div>`).join(''); };
  return `<div class="filters"><div class="seg">${[['','Todas'],...KINDS].map(([k,n])=>`<button data-act="kindFilter" data-k="${k}" aria-pressed="${kf===k}">${n}</button>`).join('')}</div></div>
    ${up.length?group(up):'<div class="empty">No hay citas próximas. <button class="btn sm" data-act="newEvent">Programar una</button></div>'}
    ${past.length?`<h2 style="font-family:var(--display);margin:32px 0 12px;color:var(--muted);font-size:18px">Anteriores</h2>${group(past)}`:''}`;
}

const isStale = p => ['agencia','freelance'].includes(p.type) && (!p.portfolioUpdated || daysSince(p.portfolioUpdated) > STALE_DAYS);
const allItems = () => S.people.flatMap(p=>p.portfolio.map(i=>({...i, owner:p})));
const itemMeta = i => i.kind==='inmueble'
  ? [label(OPS,i.operation), label(PROPS,i.propType), i.m2?`${i.m2} m²`:'', i.rooms?`${i.rooms} hab.`:'' ].filter(Boolean).join(' · ')
  : [label(IKINDS,i.kind), i.unit?`por ${i.unit}`:''].filter(Boolean).join(' · ');
const statusBadge = s => `<span class="badge ${s==='disponible'?'ok':s==='reservado'?'warn':'off'}">${label(ISTATUS,s)}</span>`;
const freshBadge = p => !['agencia','freelance'].includes(p.type) && !p.portfolio.length ? '' : isStale(p) ? `<span class="badge warn">${p.portfolioUpdated?`Cartera de hace ${daysSince(p.portfolioUpdated)} días`:'Cartera sin registrar'}</span>` : `<span class="badge ok">Cartera al día</span>`;

function vPeople(){
  const pt = S.ui.pType, qq = q();

  return `<div class="filters">
    <div class="seg">${[['','Todos'],...PTYPES.map(([k])=>[k,PTYPE_SHORT[k]])].map(([k,n])=>`<button data-act="pType" data-k="${k}" aria-pressed="${pt===k}">${n}</button>`).join('')}</div>

      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge ${p.type}">${PTYPE_SHORT[p.type]||'Otro'}</span>${freshBadge(p)}</div>
      <div class="pstats"><span><b>${av}</b> disponibles en cartera</span><span><b>${n}</b> ${n===1?'tarea abierta':'tareas abiertas'}</span></div></div>`;}).join('') || '<div class="empty">No hay colaboradores con este filtro. Añade agencias, freelances y profesionales para registrar lo que tienen en cartera.</div>'}</div>`;
}

function vPerson(){
  const p = person(S.ui.personId); const t = today();

  <div class="cols">
    <section class="panel span2"><h2>Cartera <span>${p.portfolio.filter(i=>i.status==='disponible').length} disponibles · actualizada ${p.portfolioUpdated?fmtDay(p.portfolioUpdated):'nunca'}</span></h2>
      <div class="filters" style="margin-bottom:10px"><button class="btn primary sm" data-act="newItem" data-owner="${p.id}">+ Añadir a la cartera</button><button class="btn sm" data-act="markReviewed" data-id="${p.id}" title="Marca que has revisado la cartera con el colaborador hoy">Marcar cartera revisada hoy</button>${isStale(p)?`<button class="btn sm" data-act="askUpdate" data-id="${p.id}">Crear tarea: pedir cartera actualizada</button>`:''}</div>
      ${items.length?`<div class="table-wrap"><table><thead><tr><th>Producto / servicio</th><th>Detalle</th><th>Zona</th><th class="num-r">Precio</th><th>Estado</th><th>Actualizado</th></tr></thead><tbody>
        ${items.map(i=>`<tr data-act="openItem" data-owner="${p.id}" data-id="${i.id}"><td style="font-weight:600">${esc(i.title)}${i.ref?` <span class="meta">${esc(i.ref)}</span>`:''}</td><td class="meta">${esc(itemMeta(i))}</td><td>${esc(i.zone||'—')}</td><td class="num-r">${eur(i.price)}${i.kind==='inmueble'&&i.operation==='alquiler'?'/mes':''}</td><td>${statusBadge(i.status)}</td><td class="meta">${i.updated?fmtDay(i.updated):'—'}</td></tr>`).join('')}

    </section>
    <section class="panel"><h2>Datos y condiciones</h2><dl class="kv">
      ${[['Especialidad',p.role],['Teléfono',p.phone],['Email',p.email],['Zona',p.zone],['Condiciones',p.commission],['Notas',p.notes]].filter(x=>x[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('') || '<dd class="empty">Sin datos todavía.</dd>'}</dl></section>

}

/* ============ Modales ============ */
function openModal(html){
  $('#modalRoot').innerHTML = `<div class="backdrop" data-m="close"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const m = $('#modalRoot .modal'); setTimeout(()=>m.querySelector('.title-input, input')?.focus(),30);
  return m;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
const opts = (arr,val) => arr.map(([k,n])=>`<option value="${k}" ${val===k?'selected':''}>${esc(n)}</option>`).join('');
const projOpts = (val, exclude) => `<option value="">Sin proyecto</option>` + projTree().filter(o=>!exclude||!exclude.has(o.p.id)).map(({p,depth})=>`<option value="${p.id}" ${val===p.id?'selected':''}>${'\u00a0\u00a0\u00a0'.repeat(depth)}${depth?'↳ ':''}${esc(p.name)}</option>`).join('');
const peoplePick = sel => S.people.length ? S.people.map(p=>`<button type="button" data-m="pickPerson" data-id="${p.id}" aria-pressed="${sel.includes(p.id)}"><span class="av" style="background:${p.color}">${esc(initials(p.name))}</span>${esc(p.name)}</button>`).join('') : '<span class="empty">Añade colaboradores en la sección Colaboradores.</span>';
const checklistHtml = cl => cl.map(c=>`<div class="cl-item ${c.done?'done':''}"><input type="checkbox" class="check" data-m="clToggle" data-id="${c.id}" ${c.done?'checked':''}><input type="text" data-cl="${c.id}" value="${esc(c.text)}"><button type="button" class="x" data-m="clDel" data-id="${c.id}" aria-label="Quitar">×</button></div>`).join('');

function wireModal(m, draft, hooks){
  const rerenderCl = () => { m.querySelector('.cl').innerHTML = checklistHtml(draft.checklist); m.querySelector('#clCount').textContent = clProgress(draft.checklist); };
  const addCl = () => { const inp = m.querySelector('#clNew'); const v = inp.value.trim(); if(!v) return; draft.checklist.push({id:uid(),text:v,done:false}); inp.value=''; rerenderCl(); inp.focus(); };
  m.addEventListener('input', e=>{ const id = e.target.dataset.cl; if(id){ const c = draft.checklist.find(x=>x.id===id); if(c) c.text = e.target.value; } });
  m.addEventListener('keydown', e=>{ if(e.target.id==='clNew' && e.key==='Enter'){ e.preventDefault(); addCl(); } });
  m.addEventListener('click', async e=>{
    const el = e.target.closest('[data-m]'); if(!el) return; const a = el.dataset.m;
    if(a==='pickPerson'){ const key = hooks.peopleKey; const i = draft[key].indexOf(el.dataset.id); i<0?draft[key].push(el.dataset.id):draft[key].splice(i,1); el.setAttribute('aria-pressed', i<0); }
    if(a==='clToggle'){ const c = draft.checklist.find(x=>x.id===el.dataset.id); c.done = el.checked; rerenderCl(); }
    if(a==='clDel'){ draft.checklist = draft.checklist.filter(x=>x.id!==el.dataset.id); rerenderCl(); }
    if(a==='clAdd') addCl();
    if(a==='ai'){ el.disabled = true; const old = el.innerHTML; el.innerHTML = '<span class="spinner"></span> Pensando…';
      try{ const items = await hooks.ai(); items.forEach(tx=>draft.checklist.push({id:uid(),text:String(tx),done:false})); rerenderCl(); }
      catch(err){ toast(err.message); } finally{ el.disabled=false; el.innerHTML = old; } }
    if(a==='save') hooks.save();
    if(a==='delete') hooks.del();
    if(a==='cancel') closeModal();
    if(a==='extra' && hooks.extra) hooks.extra();
  });
}
const clBlock = (draft, aiLabel) => `<div class="field"><div class="lab"><span>Checklist <span id="clCount">${clProgress(draft.checklist)}</span></span><button type="button" class="btn sm ghost" data-m="ai">✦ ${aiLabel}</button></div>
  <div class="cl">${checklistHtml(draft.checklist)}</div>
  <div class="cl-add"><input id="clNew" placeholder="Añadir elemento y pulsar Intro"><button type="button" class="btn sm" data-m="clAdd">Añadir</button></div></div>`;

  <footer>${orig?'<button class="btn danger left" data-m="delete">Eliminar</button>':''}<button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="save">${orig?'Guardar cambios':'Crear tarea'}</button></footer>`);
  const read = () => Object.assign(draft,{title:m.querySelector('#fTitle').value.trim(), projectId:m.querySelector('#fProj').value, due:m.querySelector('#fDue').value, status:m.querySelector('#fStatus').value, priority:m.querySelector('#fPrio').value, desc:m.querySelector('#fDesc').value});
  wireModal(m, draft, {peopleKey:'assignees',

    del(){ if(!confirm('¿Eliminar esta tarea?')) return; S.tasks = S.tasks.filter(t=>t.id!==draft.id); save(); closeModal(); render(); toast('Tarea eliminada'); },
    async ai(){ read(); if(!draft.title) throw new Error('Escribe primero el nombre de la tarea.');
      return aiJSON('Eres un asistente de productividad. Devuelve SOLO un array JSON de strings (5-8 pasos concretos y accionables, en español, máximo 10 palabras cada uno). Sin texto adicional.',
        `Tarea: ${draft.title}\nProyecto: ${projPath(draft.projectId)||'—'}\nDescripción: ${draft.desc||'—'}\nPasos ya existentes: ${draft.checklist.map(c=>c.text).join('; ')||'ninguno'}`); }
  });
}

function eventModal(id, preset={}, occ=''){
  const orig = id ? S.events.find(e=>e.id===id) : null;
  const draft = JSON.parse(JSON.stringify(orig || {id:uid(), title:'', kind:'reunion', date:today(), start:'10:00', end:'11:00', projectId:S.ui.project||'', attendees:[], location:'', notes:'', checklist:[], ...preset}));
  draft.repeat = Object.assign({freq:'none', interval:1, days:[], until:'', count:''}, draft.repeat||{}); draft.exdates = draft.exdates||[];
  const recOrig = orig && isRec(orig); if(recOrig && !occ) occ = orig.date;
  const shownDate = recOrig ? occ : draft.date;
  const endMode = draft.repeat.until ? 'until' : (+draft.repeat.count>0 ? 'count' : 'never');
  let daysAuto = !(draft.repeat.days.length>1 || (draft.repeat.days.length===1 && draft.repeat.days[0]!==dowOf(shownDate)));
  const m = openModal(`<header><h2>${orig?'Editar cita':'Nueva cita'}</h2><button class="icon-btn" data-m="cancel" aria-label="Cerrar">✕</button></header>
  <div class="body">
    <input class="title-input" id="eTitle" placeholder="Título de la reunión o cita" value="${esc(draft.title)}">
    ${recOrig?`<div class="note">↻ Cita recurrente (${esc(repeatText(orig))}). Estás viendo la del <b>${fmtLong(occ)}</b>. Al guardar podrás elegir si el cambio afecta solo a esta o a toda la serie.</div>`:''}
    <div class="grid3">
      <div class="field"><label for="eDate">Fecha</label><input type="date" id="eDate" value="${shownDate}"></div>
      <div class="field"><label for="eStart">Inicio</label><input type="time" id="eStart" value="${draft.start}"></div>
      <div class="field"><label for="eEnd">Fin</label><input type="time" id="eEnd" value="${draft.end}"></div>
    </div>
    <div class="field"><label for="eFreq">Repetir</label><select id="eFreq">${opts(FREQS,draft.repeat.freq)}</select></div>
    <div class="rep-box" id="repBox">
      <div class="rep-end" id="repEvery"><span>Cada</span><input type="number" id="eInterval" min="1" max="99" value="${draft.repeat.interval||1}"><span id="repUnit"></span></div>
      <div class="field" id="repDaysF"><div class="lab">Qué días</div><div class="dows">${DOW_S.map((x,i)=>`<button type="button" data-m="dow" data-i="${i}" aria-pressed="${draft.repeat.days.includes(i)}" aria-label="${DOW_L[i]}">${x}</button>`).join('')}</div></div>
      <div class="rep-end"><span>Termina</span>
        <label class="tag"><input type="radio" name="rEnd" value="never" ${endMode==='never'?'checked':''}> Nunca</label>
        <label class="tag"><input type="radio" name="rEnd" value="until" ${endMode==='until'?'checked':''}> El día <input type="date" id="eUntil" value="${draft.repeat.until}"></label>
        <label class="tag"><input type="radio" name="rEnd" value="count" ${endMode==='count'?'checked':''}> Tras <input type="number" id="eCount" min="1" value="${draft.repeat.count||10}"> veces</label>
      </div>
      <div class="meta" id="repSummary"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="eKind">Tipo</label><select id="eKind">${opts(KINDS,draft.kind)}</select></div>
      <div class="field"><label for="eProj">Proyecto</label><select id="eProj">${projOpts(draft.projectId)}</select></div>
    </div>
    <div class="field"><label for="eLoc">Lugar o enlace</label><input id="eLoc" value="${esc(draft.location)}" placeholder="Oficina, dirección o enlace de videollamada"></div>
    <div class="field"><div class="lab">Asistentes</div><div class="pick">${peoplePick(draft.attendees)}</div></div>
    ${clBlock(draft,'Proponer orden del día')}
    <div class="field"><label for="eNotes">Notas y acuerdos</label><textarea id="eNotes" placeholder="Lo que se decidió en la reunión…">${esc(draft.notes)}</textarea></div>
  </div>
  <footer id="eFoot">${orig?'<button class="btn danger left" data-m="delete">Eliminar</button><button class="btn" data-m="extra" title="Convierte los puntos pendientes del checklist en tareas">Crear tareas</button>':''}<button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="save">${orig?'Guardar cambios':'Crear cita'}</button></footer>`);
  const $m = s => m.querySelector(s);
  const readRepeat = () => { const r = draft.repeat; r.freq = $m('#eFreq').value; r.interval = Math.max(1, +$m('#eInterval').value||1);
    const mode = m.querySelector('input[name=rEnd]:checked')?.value||'never'; r.until = mode==='until' ? $m('#eUntil').value : ''; r.count = mode==='count' ? Math.max(1, +$m('#eCount').value||1) : '';
    if(r.freq==='weekly' && !r.days.length) r.days = [dowOf($m('#eDate').value||today())]; if(r.freq!=='weekly') r.days = []; };
  const syncRep = () => { const f = $m('#eFreq').value; $m('#repBox').hidden = f==='none'; $m('#repEvery').hidden = f==='weekdays';
    $m('#repDaysF').hidden = f!=='weekly'; $m('#repUnit').textContent = {daily:'día(s)',weekly:'semana(s)',monthly:'mes(es)',yearly:'año(s)'}[f]||'';
    if(f==='weekly' && !draft.repeat.days.length){ draft.repeat.days = [dowOf($m('#eDate').value||today())]; m.querySelectorAll('[data-m=dow]').forEach(b=>b.setAttribute('aria-pressed', draft.repeat.days.includes(+b.dataset.i))); }
    const tmp = {...draft, date:(recOrig?orig.date:$m('#eDate').value)||today(), repeat:{...draft.repeat}}; const keep = draft.repeat.days; draft.repeat.days = keep; tmp.repeat.freq = f; tmp.repeat.interval = +$m('#eInterval').value||1;
    const mode = m.querySelector('input[name=rEnd]:checked')?.value; tmp.repeat.until = mode==='until'?$m('#eUntil').value:''; tmp.repeat.count = mode==='count'?$m('#eCount').value:'';
    $m('#repSummary').textContent = f==='none' ? '' : '↻ ' + repeatText(tmp); };
  const syncDays = () => { if(!daysAuto) return; const ds = $m('#eDate').value; if(!ds) return; draft.repeat.days = $m('#eFreq').value==='weekly' ? [dowOf(ds)] : [];
    m.querySelectorAll('[data-m=dow]').forEach(b=>b.setAttribute('aria-pressed', draft.repeat.days.includes(+b.dataset.i))); };
  // 2) Escribir una fecha de fin o un número de veces marca esa opción automáticamente
  const pickEnd = v => { const r = m.querySelector(`input[name=rEnd][value=${v}]`); if(r) r.checked = true; };
  ['input','change','focus'].forEach(t=>{ $m('#eUntil').addEventListener(t, ()=>{ if(t!=='focus' || $m('#eUntil').value) pickEnd('until'); });
    $m('#eCount').addEventListener(t, ()=>pickEnd('count')); });
  $m('#eDate').addEventListener('change', ()=>{ syncDays(); syncRep(); });
  $m('#eFreq').addEventListener('change', ()=>{ if($m('#eFreq').value==='weekly'){ daysAuto = daysAuto || !draft.repeat.days.length; syncDays(); } });
  m.addEventListener('change', syncRep); m.addEventListener('input', e=>{ if(['eInterval','eCount','eUntil'].includes(e.target.id)) syncRep(); });
  m.addEventListener('click', e=>{ const b = e.target.closest('[data-m=dow]'); if(!b) return; const i = +b.dataset.i, arr = draft.repeat.days, k = arr.indexOf(i);
    if(k<0) arr.push(i); else if(arr.length>1) arr.splice(k,1); daysAuto = false; b.setAttribute('aria-pressed', arr.includes(i)); syncRep(); });
  syncRep();
  const read = () => { Object.assign(draft,{title:$m('#eTitle').value.trim(), date:$m('#eDate').value, start:$m('#eStart').value, end:$m('#eEnd').value, kind:$m('#eKind').value, projectId:$m('#eProj').value, location:$m('#eLoc').value, notes:$m('#eNotes').value}); readRepeat(); };
  // Tras guardar: si la cita queda oculta por un filtro o fuera del mes visible, se muestra
  const reveal = ev => { if(!ev) return ''; const notes = [];
    if(S.ui.project && !descIds(S.ui.project).has(ev.projectId)){ S.ui.project = ''; notes.push('mostrando todos los proyectos'); }
    if(q() && !(ev.title+' '+(ev.notes||'')).toLowerCase().includes(q())){ $('#q').value = ''; notes.push('búsqueda borrada'); }
    const first = isRec(ev) ? (occurrences(ev, ev.date, addDays(ev.date, 400))[0] || ev.date) : ev.date;
    if(S.ui.view==='calendar'){ const c = parseYmd(S.ui.calCursor), f = parseYmd(first);
      const inView = S.ui.calMode==='month' ? (c.getFullYear()===f.getFullYear() && c.getMonth()===f.getMonth())
        : (()=>{ const mon = addDays(S.ui.calCursor, -dowOf(S.ui.calCursor)); return first >= mon && first <= addDays(mon,6); })();
      if(!inView){ S.ui.calCursor = first; notes.push('calendario movido al ' + fmtDay(first)); } }
    return notes.length ? ' (' + notes.join(', ') + ')' : ''; };
  const done = (msg, ev) => { const extra = reveal(ev); save(); closeModal(); render(); toast(msg + extra); };
  // Botones para elegir alcance en citas recurrentes
  const askScope = (verb, onOne, onAll) => { $m('#eFoot').innerHTML = `<span class="meta left" style="margin-right:auto">¿${verb} solo esta cita o toda la serie?</span><button class="btn" data-m="back">Volver</button><button class="btn" data-m="scopeOne">Solo esta</button><button class="btn primary" data-m="scopeAll">Toda la serie</button>`;
    m.onclick = ev => { const a = ev.target.closest('[data-m]')?.dataset.m; if(a==='scopeOne'){ m.onclick=null; onOne(); } if(a==='scopeAll'){ m.onclick=null; onAll(); } if(a==='back'){ m.onclick=null; closeModal(); eventModal(id, {}, occ); } }; };
  wireModal(m, draft, {peopleKey:'attendees',
    save(){ read(); if(!draft.title||!draft.date){ toast('Añade un título y una fecha.'); return; }
      if(draft.repeat.until && draft.repeat.until < draft.date){ toast('La fecha de fin de la repetición es anterior al inicio.'); return; }
      if(m.querySelector('input[name=rEnd]:checked')?.value==='until' && !draft.repeat.until){ toast('Elige la fecha en la que termina la repetición.'); return; }
      if(draft.repeat.freq==='weekly' && !recOrig && !draft.repeat.days.includes(dowOf(draft.date))) draft.repeat.days.push(dowOf(draft.date));
      if(!orig){ S.events.push(draft); return done(isRec(draft)?'Cita recurrente creada':'Cita creada', draft); }
      if(!recOrig){ Object.assign(orig,draft); return done('Cambios guardados', orig); }
      askScope('Guardar cambios en',
        () => { orig.exdates = [...new Set([...(orig.exdates||[]), occ])]; S.events.push({...JSON.parse(JSON.stringify(draft)), id:uid(), repeat:{freq:'none',interval:1,days:[],until:'',count:''}, exdates:[]}); done('Cambios guardados en esta cita'); },
        () => { const shift = Math.round((parseYmd(draft.date) - parseYmd(occ))/864e5); const newStart = addDays(orig.date, shift);
          Object.assign(orig, draft, {date:newStart, id:orig.id, exdates: shift ? [] : (orig.exdates||[])});
          if(draft.repeat.freq==='weekly' && shift && draft.repeat.days.length===1 && draft.repeat.days[0]===dowOf(addDays(newStart,-shift))) orig.repeat.days=[dowOf(newStart)];
          done('Cambios guardados en toda la serie', orig); }); },
    del(){ if(!recOrig){ if(!confirm('¿Eliminar esta cita?')) return; S.events = S.events.filter(e=>e.id!==draft.id); return done('Cita eliminada'); }
      askScope('Eliminar',
        () => { orig.exdates = [...new Set([...(orig.exdates||[]), occ])]; done('Cita eliminada'); },
        () => { S.events = S.events.filter(e=>e.id!==orig.id); done('Serie eliminada'); }); },
    extra(){ read(); const pend = draft.checklist.filter(c=>!c.done); if(!pend.length){ toast('No hay puntos pendientes en el checklist.'); return; }
      pend.forEach(c=>S.tasks.push({id:uid(), title:c.text, desc:`Desde: ${draft.title} (${fmtDay(draft.date)})`, projectId:draft.projectId, status:'todo', priority:'media', due:'', assignees:[...draft.attendees], checklist:[], createdAt:Date.now()}));
      if(orig && !recOrig) Object.assign(orig,draft); if(recOrig) pend.forEach(p=>{ const c = orig.checklist.find(x=>x.id===p.id); if(c) c.done = true; });
