/* ============ Almacenamiento local (navegador + archivo opcional) ============ */
const fsSupported = 'showSaveFilePicker' in window && 'indexedDB' in window;
let fileHandle = null, fileOK = false, writeTimer = null;
const exportData = () => ({...S, settings:{...S.settings, apiKey:''}});
function loadData(d){ const keep = S.settings; S = d; S.settings = Object.assign({}, keep, d.settings||{}, {apiKey:keep.apiKey, theme:keep.theme}); normalize(); }
const idb = {
  db(){ return new Promise((res,rej)=>{ const r = indexedDB.open('goecalendar',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ try{ const db = await this.db(); return await new Promise(res=>{ const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db = await this.db(); await new Promise(res=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete = res; tx.onerror = res; }); }catch(e){} },
  async del(k){ try{ const db = await this.db(); await new Promise(res=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; tx.onerror = res; }); }catch(e){} }
};
function scheduleFileWrite(){ if(!fileHandle || !fileOK) return; clearTimeout(writeTimer); writeTimer = setTimeout(writeFile, 700); }
async function writeFile(){
  try{ const w = await fileHandle.createWritable(); await w.write(JSON.stringify(exportData(), null, 2)); await w.close(); S.settings.lastFileSave = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  catch(e){ fileOK = false; toast('No se pudo escribir en el archivo local. Vuelve a conectarlo desde el menú lateral.'); }
  renderStorage();
}
const FTYPES = [{description:'Datos de GOE Calendar', accept:{'application/json':['.json']}}];
async function linkFile(){
  try{ fileHandle = await window.showSaveFilePicker({suggestedName:'goecalendar-datos.json', types:FTYPES}); fileOK = true; await idb.set('handle', fileHandle); await writeFile(); toast('Guardando también en ' + fileHandle.name); }
  catch(e){ if(e.name!=='AbortError') toast('No se pudo vincular el archivo.'); }
}
async function openFile(){
  try{ const [h] = await window.showOpenFilePicker({types:FTYPES}); const d = JSON.parse(await (await h.getFile()).text());
    if(!Array.isArray(d.tasks)||!Array.isArray(d.events)){ toast('El archivo no es una copia válida de GOE Calendar.'); return false; }
    loadData(d); fileHandle = h; fileOK = (await h.requestPermission({mode:'readwrite'}))==='granted'; await idb.set('handle', h); save(); toast('Datos cargados desde ' + h.name); return true; }
  catch(e){ if(e.name!=='AbortError') toast('No se pudo abrir el archivo.'); return false; }
}
async function reconnectFile(){
  if(!fileHandle) return;
  try{ if((await fileHandle.requestPermission({mode:'readwrite'}))!=='granted') return; fileOK = true;
    const d = JSON.parse(await (await fileHandle.getFile()).text() || '{}');
    if(Array.isArray(d.tasks) && (d.savedAt||0) > (S.savedAt||0)){ loadData(d); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} toast('Datos actualizados desde el archivo'); }
    else await writeFile();
    render(); }
  catch(e){ toast('No se pudo reconectar el archivo.'); }
}
function unlinkFile(){ fileHandle = null; fileOK = false; idb.del('handle'); }
function renderStorage(){
  const el = $('#store'); if(!el) return;
  const t = S.settings.lastFileSave ? new Date(S.settings.lastFileSave).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : '';
  el.innerHTML = memOnly ? 'El navegador no está guardando. Exporta tus datos en Ajustes.'
    : fileHandle && fileOK ? `Guardado en este equipo y en ${esc(fileHandle.name)}${t?' · '+t:''}`
    : fileHandle ? `Archivo ${esc(fileHandle.name)} pendiente de permiso. <button data-act="reconnectFile">Reconectar</button>`
    : `Guardado en este navegador.${fsSupported?' <button data-act="settings">Guardar también en archivo</button>':''}`;
}
async function bootFile(){
  if(!fsSupported) return; const h = await idb.get('handle'); if(!h) return;
  fileHandle = h; try{ fileOK = (await h.queryPermission({mode:'readwrite'}))==='granted'; }catch(e){ fileOK = false; }
  renderStorage();
}

/* ============ IA ============ */
async function askClaude(system, user){
  if(!S.settings.apiKey) throw new Error('Añade tu clave de API de Anthropic en Ajustes para usar el asistente.');
  const r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.settings.model||'claude-sonnet-5', max_tokens:2000, system, messages:[{role:'user',content:user}]})});
  if(!r.ok){ let m = `Error ${r.status}`; try{ const j = await r.json(); m += ': ' + (j.error?.message||''); }catch(e){} throw new Error(m); }
  const d = await r.json(); return (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
async function aiJSON(system, user){
  const txt = await askClaude(system, user);
  const clean = txt.replace(/```json|```/g,'').trim();
  const s = clean.search(/[\[{]/); const e = Math.max(clean.lastIndexOf(']'), clean.lastIndexOf('}'));
  try{ return JSON.parse(clean.slice(s, e+1)); }catch(err){ throw new Error('La respuesta del asistente no se pudo interpretar. Prueba de nuevo.'); }
}
function context(){
  const t = today();
  return `Hoy es ${fmtLong(t)} (${t}).
Proyectos (con subproyectos, separados por ›): ${projTree().map(o=>projPath(o.p.id)).join('; ')||'ninguno'}.
Colaboradores: ${S.people.map(p=>`${p.name} (${PTYPE_SHORT[p.type]||'otro'}${p.zone?', '+p.zone:''}${p.role?', '+p.role:''})`).join('; ')||'ninguno'}.
Cartera disponible o reservada de los colaboradores: ${allItems().filter(i=>i.status!=='cerrado').slice(0,120).map(i=>`[${i.title} | ${itemMeta(i)} | ${i.zone||'-'} | ${i.price!==''?i.price+' €':'-'} | ${i.status} | de ${i.owner.name} | act. ${i.updated||'-'}]`).join(' ')||'vacía'}.
Tareas abiertas: ${S.tasks.filter(x=>x.status!=='done').map(x=>`[${x.title} | ${projPath(x.projectId)||'-'} | vence ${x.due||'-'} | ${label(STATUS,x.status)} | ${label(PRIOS,x.priority)}]`).join(' ')||'ninguna'}.
Citas próximas (30 días, recurrentes ya desplegadas): ${eventsBetween(t, addDays(t,30), S.events).slice(0,60).map(e=>`[${e.date} ${e.start} ${e.title} | ${projPath(e.projectId)||'-'}${isRec(e)?' | recurrente: '+repeatText(e):''}]`).join(' ')||'ninguna'}.`;
}
const AI_SYS = `Eres el asistente de GOE Calendar, un organizador de tareas, reuniones y proyectos. Responde SIEMPRE en español y SOLO con un objeto JSON válido, sin texto fuera del JSON, con esta forma:
{"reply":"respuesta breve para el usuario",
 "tasks":[{"title":"","due":"YYYY-MM-DD o vacío","project":"ruta exacta de proyecto existente (p.ej. Padre › Subproyecto) o vacío","assignees":["nombres de colaboradores existentes"],"priority":"baja|media|alta|urgente","checklist":["pasos"]}],
 "events":[{"title":"","kind":"reunion|cita|llamada|evento","date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","project":"","attendees":["nombres"],"location":"","repeat":{"freq":"none|daily|weekdays|weekly|monthly|yearly","interval":1,"days":["lun","mar","mie","jue","vie","sab","dom"],"until":"YYYY-MM-DD o vacío","count":0}}],
 "reschedule":[{"task":"título exacto de una tarea existente","due":"YYYY-MM-DD"}]}
Usa listas vacías cuando no proceda. Interpreta fechas relativas a partir de hoy. Para citas que se repiten ("todos los lunes", "cada 15 días", "el primer día de cada mes", "cada martes y jueves hasta diciembre") crea UNA sola cita con "repeat" rellenado y "date" = primera ocurrencia; "days" solo para weekly; si no se repite usa freq "none". "cada 15 días" = weekly con interval 2. Si solo te piden un resumen o consejo, deja las listas vacías y responde en "reply". Si preguntan qué hay en cartera (por zona, precio, tipo, etc.), busca en la cartera de los colaboradores y responde en "reply" indicando cada coincidencia y de qué colaborador es.`;
let proposal = null;
function aiRepeat(r, date){
  if(!r || !r.freq || r.freq==='none' || !FREQS.some(f=>f[0]===r.freq)) return null;
  const map = {lun:0,lunes:0,mar:1,martes:1,mie:2,'mié':2,miercoles:2,'miércoles':2,jue:3,jueves:3,vie:4,viernes:4,sab:5,'sáb':5,sabado:5,'sábado':5,dom:6,domingo:6};
  const days = r.freq==='weekly' ? [...new Set((r.days||[]).map(d=>typeof d==='number'?d:map[String(d).toLowerCase()]).filter(d=>d>=0&&d<=6))] : [];
  return {freq:r.freq, interval:Math.max(1,+r.interval||1), days: r.freq==='weekly' && !days.length && date ? [dowOf(date)] : days, until:r.until||'', count:+r.count>0?+r.count:''};
}
function aiLog(html, cls){ const d = document.createElement('div'); d.className = 'msg '+cls; d.innerHTML = html; $('#aiLog').appendChild(d); $('#aiLog').scrollTop = 1e9; return d; }
const findBy = (list, name) => { const n = (name||'').toLowerCase().trim(); return n ? list.find(x=>x.name.toLowerCase()===n) || list.find(x=>x.name.toLowerCase().includes(n) || n.includes(x.name.toLowerCase())) : null; };
async function aiSend(text){
  text = (text||'').trim(); if(!text) return;
  aiLog(esc(text),'me'); $('#aiInput').value='';
  const wait = aiLog('<span class="spinner"></span> Pensando…','ai');
  try{
    const r = await aiJSON(AI_SYS, context()+'\n\nPetición: '+text);
    wait.remove(); proposal = {tasks:r.tasks||[], events:r.events||[], reschedule:r.reschedule||[]};
    aiLog(esc(r.reply||'Hecho.'),'ai');
    const items = [
      ...proposal.events.map((e,i)=>`<label class="prop"><input type="checkbox" class="check" data-prop="events:${i}" checked><div><b>${esc(e.title)}</b><div class="ps">${label(KINDS,e.kind||'reunion')} · ${e.date?fmtDay(e.date):''} ${esc(e.start||'')}${e.project?' · '+esc(e.project):''}${aiRepeat(e.repeat, e.date)?' · ↻ '+esc(repeatText({date:e.date||today(), repeat:aiRepeat(e.repeat, e.date)})):''}</div></div></label>`),
      ...proposal.tasks.map((t,i)=>`<label class="prop"><input type="checkbox" class="check" data-prop="tasks:${i}" checked><div><b>${esc(t.title)}</b><div class="ps">Tarea${t.due?' · '+fmtDay(t.due):''}${t.project?' · '+esc(t.project):''}${t.checklist?.length?' · '+t.checklist.length+' pasos':''}</div></div></label>`),
      ...proposal.reschedule.map((x,i)=>`<label class="prop"><input type="checkbox" class="check" data-prop="reschedule:${i}" checked><div><b>${esc(x.task)}</b><div class="ps">Nueva fecha: ${x.due?fmtDay(x.due):'—'}</div></div></label>`)
    ];
    if(items.length){ const box = document.createElement('div'); box.style.cssText='display:flex;flex-direction:column;gap:6px'; box.innerHTML = items.join('') + '<button class="btn primary" data-act="aiApply">Añadir seleccionados</button>'; $('#aiLog').appendChild(box); $('#aiLog').scrollTop=1e9; }
  }catch(err){ wait.remove(); aiLog(esc(err.message),'err'); }
}
function aiApply(btn){
  if(!proposal) return; let n = 0;
  btn.parentElement.querySelectorAll('[data-prop]').forEach(cb=>{ if(!cb.checked) return; const [k,i] = cb.dataset.prop.split(':'); const x = proposal[k][+i]; n++;
    if(k==='tasks') S.tasks.push({id:uid(), title:x.title, desc:'', projectId:findProj(x.project)?.id||S.ui.project||'', status:'todo', priority:PRIOS.some(p=>p[0]===x.priority)?x.priority:'media', due:x.due||'', assignees:(x.assignees||[]).map(a=>findBy(S.people,a)?.id).filter(Boolean), checklist:(x.checklist||[]).map(c=>({id:uid(),text:String(c),done:false})), createdAt:Date.now()});
    if(k==='events') S.events.push({id:uid(), title:x.title, kind:KINDS.some(p=>p[0]===x.kind)?x.kind:'reunion', date:x.date||today(), start:x.start||'10:00', end:x.end||'', projectId:findProj(x.project)?.id||S.ui.project||'', attendees:(x.attendees||[]).map(a=>findBy(S.people,a)?.id).filter(Boolean), location:x.location||'', notes:'', checklist:[], repeat:aiRepeat(x.repeat, x.date)||{freq:'none',interval:1,days:[],until:'',count:''}, exdates:[]});
    if(k==='reschedule'){ const t = S.tasks.find(t=>t.title.toLowerCase()===String(x.task).toLowerCase()); if(t&&x.due) t.due = x.due; }
  });
  proposal = null; btn.parentElement.remove(); save(); render(); toast(`${n} ${n===1?'cambio aplicado':'cambios aplicados'}`);
}

/* ============ Eventos globales ============ */
const ACT = {
  view: el => { S.ui.view = el.dataset.v; save(); render(); $('#side').classList.remove('open'); },
  proj: el => { S.ui.project = el.dataset.id; save(); render(); $('#side').classList.remove('open'); },
  newTask: el => taskModal(null, {...(el.dataset.status?{status:el.dataset.status}:{}), ...(el.dataset.person?{assignees:[el.dataset.person]}:{})}),
  newEvent: el => eventModal(null, {...(el.dataset.date?{date:el.dataset.date}:{}), ...(el.dataset.person?{attendees:[el.dataset.person]}:{})}),
  newProject: () => projectModal(),
  newSubProject: el => projectModal(null, el.dataset.id),
  editProject: el => projectModal(el.dataset.id),
  toggleProj: el => { S.ui.collapsed = S.ui.collapsed||{}; S.ui.collapsed[el.dataset.id] = !S.ui.collapsed[el.dataset.id]; save(); renderNav(); },
  newPerson: () => personModal(),
  openTask: el => taskModal(el.dataset.id),
  openEvent: el => eventModal(el.dataset.id, {}, el.dataset.occ||''),
  openPerson: el => { S.ui.view = 'person'; S.ui.personId = el.dataset.id; save(); render(); $('#view').scrollTop = 0; },
  editPerson: el => personModal(el.dataset.id),
  pType: el => { S.ui.pType = el.dataset.k; save(); render(); },
  newItem: el => itemModal(el.dataset.owner||'', null),
  openItem: el => itemModal(el.dataset.owner, el.dataset.id),
  addLog: el => logModal(el.dataset.id),
  delLog: el => { const p = person(el.dataset.owner); if(!confirm('¿Borrar este registro del historial?')) return; p.log = p.log.filter(l=>l.id!==el.dataset.id); save(); render(); },
  markReviewed: el => { person(el.dataset.id).portfolioUpdated = today(); save(); render(); toast('Cartera marcada como revisada hoy'); },
  askUpdate: el => { const p = person(el.dataset.id); S.tasks.push({id:uid(), title:`Pedir cartera actualizada a ${p.name}`, desc:'Qué tienen nuevo, qué se ha vendido o reservado y precios actualizados.', projectId:'', status:'todo', priority:'media', due:addDays(today(),2), assignees:[], checklist:[], createdAt:Date.now()}); save(); render(); toast('Tarea creada'); },
  reconnectFile: () => reconnectFile(),
  toggleTask: (el,e) => { e.stopPropagation(); const t = S.tasks.find(x=>x.id===el.dataset.id); t.status = el.checked?'done':'todo'; save(); render(); },
  calMove: el => { const d = parseYmd(S.ui.calCursor), n = +el.dataset.d; if(S.ui.calMode==='month') d.setMonth(d.getMonth()+n, 1); else d.setDate(d.getDate()+7*n); S.ui.calCursor = ymd(d); save(); render(); },
  calToday: () => { S.ui.calCursor = today(); save(); render(); },
  calMode: el => { S.ui.calMode = el.dataset.m; save(); render(); },
  kindFilter: el => { S.ui.kindFilter = el.dataset.k; save(); render(); },
  settings: () => settingsModal(),
  theme: () => { const dark = matchMedia('(prefers-color-scheme: dark)').matches; const cur = S.settings.theme || (dark?'dark':'light'); S.settings.theme = cur==='dark'?'light':'dark'; applyTheme(); save(); },
  toggleSide: () => $('#side').classList.toggle('open'),
  openAI: () => { $('#drawer').classList.add('open'); $('#side').classList.remove('open'); setTimeout(()=>$('#aiInput').focus(),200); },
  closeAI: () => $('#drawer').classList.remove('open'),
  aiSend: () => aiSend($('#aiInput').value),
  aiQuick: el => aiSend(el.dataset.q),
  aiApply: el => aiApply(el)
};
document.addEventListener('click', e=>{
  if(e.target.closest('#modalRoot')){ if(e.target.dataset.m==='close') closeModal(); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='toggleTask'){ ACT.toggleTask(el,e); return; }
  ACT[el.dataset.act]?.(el,e);
});
document.addEventListener('change', e=>{ const f = e.target.dataset.filter; if(!f) return; S.ui[f] = e.target.type==='checkbox'?e.target.checked:e.target.value; save(); render(); });
$('#q').addEventListener('input', ()=>render());
$('#aiInput').addEventListener('keydown', e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) aiSend(e.target.value); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if($('#modalRoot').innerHTML) closeModal(); else $('#drawer').classList.remove('open'); }
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || $('#modalRoot').innerHTML || e.metaKey || e.ctrlKey) return;
  if(e.key==='n'){ e.preventDefault(); taskModal(null); }
  if(e.key==='c'){ e.preventDefault(); eventModal(null); }
});
function applyTheme(){ if(S.settings.theme) document.documentElement.dataset.theme = S.settings.theme; else delete document.documentElement.dataset.theme; }
applyTheme(); render(); bootFile();
</script>
